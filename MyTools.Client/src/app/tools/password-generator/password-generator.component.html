<div class="tool-container">
  <h1>Password / Secret Generator</h1>

  <div class="options-bar">
    <label class="option">Length: <input type="number" [(ngModel)]="length" min="8" max="128" class="input-num" /></label>
    <label class="option">Quantity: <input type="number" [(ngModel)]="quantity" min="1" max="20" class="input-num" /></label>
  </div>

  <div class="charset-bar">
    <label class="option checkbox-option"><input type="checkbox" [(ngModel)]="uppercase" /> Uppercase (A-Z)</label>
    <label class="option checkbox-option"><input type="checkbox" [(ngModel)]="lowercase" /> Lowercase (a-z)</label>
    <label class="option checkbox-option"><input type="checkbox" [(ngModel)]="digits" /> Digits (0-9)</label>
    <label class="option checkbox-option"><input type="checkbox" [(ngModel)]="symbols" /> Symbols</label>
    @if (symbols) {
      <label class="option">Symbols: <input type="text" [(ngModel)]="customSymbols" class="input-symbols" /></label>
    }
  </div>

  <div class="action-bar">
    <button (click)="generate()" [disabled]="!uppercase && !lowercase && !digits && !symbols" class="btn-primary">Generate</button>
  </div>

  @if (passwords.length > 0) {
    <div class="results">
      <div class="results-header">
        <span>{{ passwords.length }} password{{ passwords.length > 1 ? 's' : '' }}</span>
        <button (click)="copyAll()" class="btn-sm">Copy All</button>
      </div>
      @for (pw of passwords; track $index) {
        <div class="pw-item">
          <code>{{ pw }}</code>
          <div class="pw-meta">
            <span class="strength" [class]="getStrength(pw).class">{{ getStrength(pw).label }}</span>
            <button (click)="copyOne(pw)" class="btn-copy" title="Copy">📋</button>
          </div>
        </div>
      }
    </div>
  }

  <div class="toolbar"><button (click)="clear()" class="btn-secondary" [disabled]="passwords.length === 0">Clear</button></div>
</div>
