services:
  mytools:
    build:
      context: .
      dockerfile: Dockerfile
    image: mytools:latest
    container_name: mytools
    ports:
      # Host 8080 -> container 8080 (Kestrel). Change the left number to use
      # a different host port, e.g. "9000:8080".
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
